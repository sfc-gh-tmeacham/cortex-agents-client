[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-cortex-agents"
version = "0.3.0"
description = "Python client library for the Snowflake Cortex Agents REST API"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
jwt = [
    "cryptography>=42",
    "PyJWT>=2.8",
]
streamlit = [
    "streamlit>=1.64",
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30,<1",
    "pytest-cov>=5.0",
    "streamlit>=1.64",
    "pandas>=2.0",
    "cryptography>=42",
    "PyJWT>=2.8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Documentation = "https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents"

[tool.setuptools.packages.find]
where = ["src"]
include = ["streamlit_cortex_agents*"]

[tool.setuptools.package-data]
streamlit_cortex_agents = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pin ruff's default rule set so results do not depend on a user-level config.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src/streamlit_cortex_agents"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires real Snowflake credentials (deselect with -m 'not live')",
]
# Live tests are excluded by default so that a bare `pytest` never reaches the
# network or spends credits, even for a developer who has the live env vars set.
# Select them explicitly with `-m live`, which overrides this default.
addopts = "--tb=short -m 'not live'"

[tool.coverage.run]
source = ["streamlit_cortex_agents"]
omit = ["tests/*", "examples/*"]
