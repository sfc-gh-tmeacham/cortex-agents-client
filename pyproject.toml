[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-agents-client"
version = "0.1.0"
description = "Python client library for the Snowflake Cortex Agents REST API"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
jwt = [
    "cryptography>=42",
    "PyJWT>=2.8",
]
streamlit = [
    "streamlit>=1.59",
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "streamlit>=1.59",
    "pandas>=2.0",
    "cryptography>=42",
    "PyJWT>=2.8",
]

[project.urls]
Documentation = "https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents"

[tool.setuptools.packages.find]
where = ["."]
include = ["cortex_agents_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires real Snowflake credentials (deselect with -m 'not live')",
]
addopts = "--tb=short"

[tool.coverage.run]
source = ["cortex_agents_client"]
omit = ["tests/*", "examples/*"]

[dependency-groups]
dev = []
